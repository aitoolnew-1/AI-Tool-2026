<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your AI Tool | AIToolsHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #f8fafc;
            font-weight: 500;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #38bdf8;
        }

        .submit-form-btn {
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .submit-form-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        .pricing-notice {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            margin-bottom: 25px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-robot"></i> <span>AIToolsHub</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#tools">All Tools</a>
        </nav>
    </header>

    <!-- Form Section -->
    <main class="container">
        <div class="form-container">
            <h2 style="margin-bottom: 10px;">Submit Your AI Tool</h2>
            <p style="color: #94a3b8; margin-bottom: 20px;">Get featured in front of thousands of AI enthusiasts.</p>

            <div class="pricing-notice">
                <i class="fa-solid fa-circle-info"></i> <strong>Note:</strong> Standard listings are processed within 48 hours.
            </div>

            <!-- Formspree Form Integration -->
            <form action="https://formspree.io/f/xwllogjz" method="POST">
                
                <div class="form-group">
                    <label for="toolName">AI Tool Name *</label>
                    <input type="text" id="toolName" name="Tool Name" placeholder="e.g. ChatGPT" required>
                </div>

                <div class="form-group">
                    <label for="websiteUrl">Tool Website URL *</label>
                    <input type="url" id="websiteUrl" name="Website URL" placeholder="https://example.com" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="Category" required>
                        <option value="">Select Category</option>
                        <option value="Writing & Copywriting">Writing & Copywriting</option>
                        <option value="Image & Design">Image & Design</option>
                        <option value="Coding & Tech">Coding & Tech</option>
                        <option value="Video & Audio">Video & Audio</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pricing">Pricing Model *</label>
                    <select id="pricing" name="Pricing Model" required>
                        <option value="Free">Free</option>
                        <option value="Freemium">Freemium</option>
                        <option value="Paid">Paid</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Short Description *</label>
                    <textarea id="description" name="Description" rows="4" placeholder="Briefly describe what your AI tool does..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="email">Your Email Address *</label>
                    <input type="email" id="email" name="Submitter Email" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="submit-form-btn">Submit Tool for Review</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 AIToolsHub. Built on GitHub Pages.</p>
    </footer>

</body>
</html>
